name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      # The Firestore and Auth emulators run on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions

      - name: Lint
        run: npm run lint
      - name: Typecheck (app)
        run: npx tsc --noEmit
      - name: Typecheck (functions)
        run: npx tsc --noEmit -p functions
      - name: Unit tests
        run: npm test
      - name: Emulator tests (Firestore + Auth)
        run: npm run test:emulator
